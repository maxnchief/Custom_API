<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Seinfeld Quote Generator</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 2rem;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      max-width: 1000px;
      width: 100%;
      gap: 2rem;
      justify-content: center;
      align-items: flex-start;
    }

    .left-side {
      flex: 1 1 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .speech-bubble {
      position: relative;
      background: #fff;
      border: 2px solid black;
      border-radius: 25px;
      padding: 20px;
      font-size: 1.4rem;
      font-weight: bold;
      min-height: 150px;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50px;
      width: 0;
      height: 0;
      border: 20px solid transparent;
      border-top-color: black;
      border-bottom: 0;
      margin-left: -10px;
    }

    #quote {
      font-size: 1.3rem;
    }

    #meta {
      font-size: 1rem;
      font-style: italic;
      margin-top: 1rem;
    }

    .character-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .character-buttons button {
      flex: 1 1 120px;
      padding: 10px;
      border: 2px solid black;
      background-color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .character-buttons button.selected {
      background-color: lightblue;
    }

    .quote-btn {
      padding: 10px 20px;
      font-weight: bold;
      border: 2px solid black;
      background-color: white;
      cursor: pointer;
      align-self: center;
    }

    .right-side {
      flex: 1 1 300px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .right-side img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Seinfeld Quote Generator</h1>

  <div class="container">
    <div class="left-side">
      <div class="speech-bubble">
        <div id="quote">Click a character and generate a quote!</div>
        <div id="meta"></div>
      </div>

      <button class="quote-btn" onclick="generateQuote()">Get a quote</button>

      <div class="character-buttons">
        <button onclick="selectCharacter('jerry')">Jerry</button>
        <button onclick="selectCharacter('george')">George</button>
        <button onclick="selectCharacter('elaine')">Elaine</button>
        <button onclick="selectCharacter('kramer')">Kramer</button>
        <button onclick="selectCharacter('side')">Side Character</button>
        <button onclick="selectCharacter('random')">Random</button>
      </div>
    </div>

    <div class="right-side">
      <img id="character-img" src="" alt="Character Image" />
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5050/quotes';
    let selectedCharacter = null;
    let currentQuotes = [];

    const characterImages = {
      jerry: 'images/jerry.jpeg',
      george: 'images/george.jpeg',
      elaine: 'images/elaine.jpeg',
      kramer: 'images/kramer.jpeg',
      side: 'images/S-logo.png',
      random: 'images/S-logo.png'
    };

    function selectCharacter(character) {
      selectedCharacter = character;

      // highlight selected button
      document.querySelectorAll('.character-buttons button').forEach(btn => {
        btn.classList.remove('selected');
        if (btn.innerText.toLowerCase() === character) {
          btn.classList.add('selected');
        } else if (character === 'side' && btn.innerText.toLowerCase().includes('side')) {
          btn.classList.add('selected');
        } else if (character === 'random' && btn.innerText.toLowerCase().includes('random')) {
          btn.classList.add('selected');
        }
      });

      // update image
      const img = document.getElementById('character-img');
      img.src = characterImages[character] || '';
      img.style.display = 'block';

      // fetch quotes
      fetchQuotes(character);
    }

    async function fetchQuotes(character) {
      const endpoint =
        character === 'random'
          ? `${API_BASE}?page=1&per_page=1000`
          : character === 'side'
            ? `${API_BASE}?page=1&per_page=1000`
            : `${API_BASE}/${character}`;

      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        currentQuotes = character === 'random' || character === 'side' ? data.quotes : data;
        if (character === 'side') {
          currentQuotes = currentQuotes.filter(q =>
            !['jerry', 'george', 'elaine', 'kramer'].includes(q.author.toLowerCase())
          );
        }
        showRandomQuote();
      } catch (err) {
        console.error('Error fetching quotes', err);
        document.getElementById('quote').innerText = 'Error fetching quote.';
        document.getElementById('meta').innerText = '';
      }
    }

    function showRandomQuote() {
      if (!currentQuotes.length) return;

      const random = currentQuotes[Math.floor(Math.random() * currentQuotes.length)];
      document.getElementById('quote').innerText = `"${random.quote}"`;
      document.getElementById('meta').innerText = `${random.author}, Season ${random.season}, Episode ${random.episode}`;
    }

    function generateQuote() {
      if (!selectedCharacter) return;
      if (!currentQuotes.length) return fetchQuotes(selectedCharacter);
      showRandomQuote();
    }
  </script>
</body>
</html>
